global:
  scrape_interval: 10s

scrape_configs:
  - job_name: kong
    static_configs:
      - targets: ["kong:8001"]
  - job_name: pets-service
    metrics_path: /metrics
    static_configs:
      - targets: ["pets-service:3001"]
  - job_name: appointments-service
    metrics_path: /metrics
    static_configs:
      - targets: ["appointments-service:3002"]

